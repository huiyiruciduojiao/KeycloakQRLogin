openapi: 3.0.3
info:
  title: Keycloak QR Login API
  version: 2.0.0
  description: Same-realm mobile approval. Single-node storage. Browser completion uses Keycloak authentication actions.
servers:
  - url: /realms/{realm}/qr-login
    variables:
      realm:
        default: demo
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Same-realm enabled user token with configured audience and azp and a valid user session. No special client role is required. Service accounts are rejected.
  parameters:
    transactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
  schemas:
    Result:
      type: object
      required: [status, application, user_code, expires_at]
      properties:
        status:
          type: string
          enum: [SCANNED, CONFIRMED, DENIED]
        application:
          type: string
        user_code:
          type: string
        expires_at:
          type: integer
          format: int64
          description: UTC epoch milliseconds
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [transaction_not_found, invalid_token, not_allowed, invalid_transition]
  responses:
    Success:
      description: Transition completed or identical operation retried by the same user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unauthorized:
      description: Missing or invalid user bearer token
    Forbidden:
      description: User, client or authorized party is not allowed
    NotFound:
      description: Unknown, expired or wrong-realm transaction
    Conflict:
      description: Wrong user or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /transactions/{id}/scan:
    post:
      operationId: scan
      summary: Bind transaction to the scanning user
      parameters:
        - $ref: '#/components/parameters/transactionId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /transactions/{id}/confirm:
    post:
      operationId: confirm
      summary: Explicitly approve login as the same user who scanned
      parameters:
        - $ref: '#/components/parameters/transactionId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /transactions/{id}/deny:
    post:
      operationId: deny
      summary: Reject login as the same user who scanned
      parameters:
        - $ref: '#/components/parameters/transactionId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
