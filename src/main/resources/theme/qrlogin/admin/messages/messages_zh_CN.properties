avatarSettings=用户头像
avatarEnabled=启用用户头像
avatarEnabledHelp=仅对当前 Realm 生效。关闭后头像接口不可访问，已有文件保留。保存后对新请求生效。
avatarPublicBaseUrl=公开访问地址（警告：HTTP 明文传输图片）
avatarPublicBaseUrlHelp=Keycloak 的 HTTP 或 HTTPS 根地址，包括 /auth 等上下文路径，不含 /realms。签名图片地址使用此地址。
avatarClients=允许的客户端
avatarAllowRealmClients=领域允许（允许领域内所有客户端）
avatarAllowRealmClientsHelp=开启后允许当前领域内所有已启用客户端，忽略下方白名单；关闭后恢复白名单。仍需有效普通用户会话，跨域请求仍遵循客户端 Web Origins 设置。
avatarClientsHelp=关闭“领域允许”时，逐项添加现有客户端 ID，账户中心请添加 account-console。开启“领域允许”时可以留空，已有列表保留但不参与校验。
avatarUrlTtl=图片地址有效期（秒）
avatarUrlTtlHelp=60 至 3600 秒，默认 900 秒。地址持有者在到期前可以加载图片。
avatarStorageQuota=头像存储容量（字节）
avatarStorageQuotaHelp=当前 Realm 的容量，默认 1073741824（1 GiB）。文件自动存入 Keycloak data/avatars 下的 Realm 独立目录。降低配额不会删除已有图片，仅限制新写入。签名密钥由 Realm 密钥管理提供，无需输入；可在“密钥”页管理 HS256 密钥轮换。
avatarInvalidParent=头像设置必须属于当前 Realm。
avatarDuplicateSettings=当前 Realm 已有头像设置，请修改已有配置。
avatarUnknownSetting=包含不支持的头像配置项。
avatarInvalidSettings=头像配置无效。启用时请填写 HTTP 或 HTTPS 根地址及允许的客户端，并确认有效期为 60–3600 秒、容量至少 1048576 字节。
avatarInvalidClients=请逐项填写已存在且启用的客户端 ID，最多 100 个，不支持通配符或逗号分隔。
