avatarSettings=User avatars
avatarEnabled=Enable user avatars
avatarEnabledHelp=Applies to this realm. Disabling blocks avatar endpoints but preserves files. Saved changes apply to new requests.
avatarPublicBaseUrl=Public base URL (Warning: HTTP sends images without encryption)
avatarPublicBaseUrlHelp=The HTTP or HTTPS Keycloak root including any context path such as /auth, without /realms. Used for signed image URLs.
avatarClients=Allowed clients
avatarAllowRealmClients=Allow all clients in this realm
avatarAllowRealmClientsHelp=When enabled, allows all enabled clients in the current realm and ignores the list below. Disabling restores the allowlist. Valid human user sessions and client Web Origins are still required.
avatarClientsHelp=When realm-wide access is off, add existing client IDs individually, including account-console for the account UI. With realm-wide access on, this list is optional and preserved but ignored.
avatarUrlTtl=Image URL lifetime (seconds)
avatarUrlTtlHelp=60 to 3600 seconds; default 900. Anyone holding the signed URL can load the image before expiry.
avatarStorageQuota=Avatar storage capacity (bytes)
avatarStorageQuotaHelp=Per-realm quota, default 1073741824 (1 GiB). Files use a managed realm directory under Keycloak data/avatars. Lowering the quota preserves existing images and limits new writes. Signing uses realm-managed HS256 keys; rotate them in the Keys tab without entering secrets here.
avatarInvalidParent=Avatar settings must belong to this realm.
avatarDuplicateSettings=Avatar settings already exist for this realm. Update the existing configuration.
avatarUnknownSetting=Unsupported avatar configuration field.
avatarInvalidSettings=Invalid avatar settings. When enabled, provide an HTTP or HTTPS base URL and allowed clients; lifetime must be 60–3600 seconds and capacity at least 1048576 bytes.
avatarInvalidClients=Enter up to 100 existing enabled client IDs individually, without wildcards or commas.
